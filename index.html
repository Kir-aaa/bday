<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthdayy!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>HAPPY BIRTHDAY!</h1>
   
    <img src="images/redvelvetcake_lit.png" id="cake_lit">
    <button class="center" onclick="change_cake(), confetti()" id="cake_btn">Blow the candle</button>
    
    <br>
    <hr>
    <br>
 
    <div class="whole_cards">
        <div class="card">
            <img src="images/heart.png" class="card_content">
            <h2>You are loved</h2>
        </div>
        <div class="card">
            <img src="images/balloon.png" class="card_content">
            <h2>You are amazing</h2>
        </div>
        <div class="card">
            <img src="images/heart.png" class="card_content">
            <h2>I'm proud of you</h2>
        </div>
        <div class="card">
            <img src="images/balloon.png" class="card_content">
            <h2>Don't forget to smile</h2>
        </div>
    </div>
    <p class="card_guide">you can also just slide with your finger</p>

    <br>
    <hr>
    <br>

    <div id="envelope" class="center" onclick="openLetter()">
        <div class="warning">
            <p>There is a message for you</p>
            <p>click here to open it!</p>
        </div>
        <div id="message">
            <p>Happy birthday! I hope you have a wonderful day!</p>
            <p>Today is your special day, so have some fun!</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        document.getElementById("cake_btn").addEventListener("click",()=> confetti());

        function change_cake()
    {
        let redvelvetcake = document.getElementById("cake_lit");
        redvelvetcake.src="images/redvelvetcake_blown.png";
        return false
    }

        function openLetter(){
            let envelope = document.getElementById("envelope");
            let message = document.getElementById("message");
            let warning = document.querySelector(".warning");
            message.style.display = "block";
            envelope.style.backgroundColor = "rgb(210, 143, 105)";
            warning.style.display = "none";
        }    
    
    </script>
</body>
</html>
